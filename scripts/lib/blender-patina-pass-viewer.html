  canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();state.contextLost=true;image.style.display='block';canvas.style.display='none';status.textContent='三维上下文中断，已显示同场景 Blender 渲染。';});
  state.resetMetrics=()=>{state.frames=0;state.frameTimes=[];last=performance.now();};
  state.readMetrics=()=>{const sorted=[...state.frameTimes].sort((a,b)=>a-b);return {ready:state.ready,assetSha256:state.assetSha256,assetBytes:state.assetBytes,networkBytesVerified:state.networkBytesVerified,materials:state.materials,lightmap:state.lightmap,reflectionProbe:state.reflectionProbe,staticAreaVisibility:state.staticAreaVisibility,reflectionCalibration:state.reflectionCalibration,diskLightCalibration:state.diskLightCalibration,lightingMode:state.lightingMode,renderSettings:state.renderSettings,loadMs:state.loadMs,frames:state.frames,sampleCount:sorted.length,sampleSeconds:state.frameTimes.reduce((a,b)=>a+b,0)/1000,p95FrameMs:sorted[Math.ceil(sorted.length*.95)-1]??null,p99FrameMs:sorted[Math.ceil(sorted.length*.99)-1]??null,gpu:state.gpu,drawCalls:state.drawCalls,triangles:state.triangles,bounds:state.bounds,errors:state.errors,picked:state.picked,contextLost:state.contextLost,reducedMotion:state.reducedMotion,viewport:[innerWidth,innerHeight],overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)};};
  state.probeHero=()=>{const point=vector([0,.45,.99]).project(camera);return {name:pick(new THREE.Vector2(point.x,point.y)),ndc:[point.x,point.y]};};
  state.loseContext=()=>context.getExtension('WEBGL_lose_context')?.loseContext();
  status.textContent='模型与室内光照已载入 · 本地美术候选 · 艺术与目标设备验收待完成';
} catch(error){state.errors.push(String(error));status.textContent='预览失败：'+String(error);}
</script>
