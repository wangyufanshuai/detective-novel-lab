name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Engine and safety tests
        run: npm run test

      - name: Campaign study guard tests
        run: npm run test:campaign-study

      - name: Command Deck authority invariants
        run: npm run test:command-deck-invariants

      - name: Generated world invariants
        run: npm run test:world-invariants

      - name: Detective content validation
        run: npm run content:validate -- --json

      - name: Repository privacy and artifact boundary
        run: npm run quality:repository-safety

      - name: Performance budget
        run: npm run quality:performance-budget -- --json

      - name: Evaluation benchmark
        run: npm run eval

      - name: Emergence benchmark
        run: npm run benchmark:emergence

      - name: Build
        run: npm run build

      - name: Scenario Agent API smoke
        run: npm run test:scenario-api

      - name: SDK Client smoke
        run: npm run test:sdk-client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Static runtime boundary
        run: npm run qa:static-boundary -- --json

      - name: Command Deck browser QA
        run: npm run qa:command-deck -- --json

      - name: Browser E2E
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
